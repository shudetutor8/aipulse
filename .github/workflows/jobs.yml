# Runs AI Pulse's automatic jobs on GitHub's computers (free for public repositories).
# Needs three repository secrets (Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_URL          your Supabase project URL
#   SUPABASE_SECRET_KEY   the SECRET key from Supabase → Project Settings → API Keys
#   GROQ_API_KEY          optional: free AI key from console.groq.com
# Without GROQ_API_KEY (or when Groq is over its free limit), a free open-source AI model
# (Qwen3-4B, Apache 2.0) runs right here on GitHub's computer instead.
# Fully automatic by default. Optional repository variables ("Variables" tab): AUTO_PUBLISH_POLLS = false to review
# polls and predictions yourself before they go live; SITE_URL
name: Automatic jobs

on:
  schedule:
    - cron: "7,37 * * * *"   # news + moderation, every 30 minutes
    - cron: "20 */6 * * *"   # new hot-topic polls, predictions and the Model Index, every 6 hours
    - cron: "5 12 * * *"     # Discussion of the day, 12:05 UTC (8:05 am New York in summer, 7:05 am in winter)
  workflow_dispatch:
    inputs:
      jobs:
        description: "Jobs to run: news, moderate, polls, predictions, models, discussion or all"
        default: "all"
        required: true

env:
  LLAMA_TAG: b11800   # llama.cpp release used for the built-in AI (falls back to the newest if missing)

permissions:
  contents: read
  actions: write   # lets the keep-alive step below stop GitHub from pausing the schedule

concurrency:
  group: aipulse-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jobs/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Free built-in AI: downloaded once, then kept in GitHub's cache.
      - name: Restore built-in AI model
        id: localai
        uses: actions/cache@v4
        with:
          path: ~/localai
          key: localai-qwen3-4b-q4km-llamacpp-${{ env.LLAMA_TAG }}
      - name: Download built-in AI model (first run only)
        if: steps.localai.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          set -e
          trap 'echo "Download failed; will try again next run."; rm -rf ~/localai' ERR
          mkdir -p ~/localai && cd ~/localai
          find_asset() { gh release view "$1" --repo ggml-org/llama.cpp --json assets --jq '.assets[].name' | grep -E 'bin-ubuntu-x64\.(zip|tar\.gz)$' | head -1; }
          TAG="$LLAMA_TAG"
          ASSET="$(find_asset "$TAG" || true)"
          if [ -z "$ASSET" ]; then
            TAG="$(gh release view --repo ggml-org/llama.cpp --json tagName --jq .tagName)"
            ASSET="$(find_asset "$TAG")"
          fi
          echo "AI engine: llama.cpp $TAG ($ASSET)"
          gh release download "$TAG" --repo ggml-org/llama.cpp --pattern "$ASSET" --clobber
          rm -rf engine && mkdir engine
          case "$ASSET" in *.zip) unzip -q "$ASSET" -d engine ;; *) tar -xzf "$ASSET" -C engine ;; esac
          rm -f "$ASSET"
          SERVER="$(find "$PWD/engine" -type f -name llama-server | head -1)"
          chmod +x "$SERVER"
          echo "$SERVER" > server-path.txt
          curl -fsSL --retry 3 -o model.gguf.part "https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
          mv model.gguf.part model.gguf
          ls -la ~/localai
      - name: Pick jobs
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED: ${{ github.event.inputs.jobs }}
        run: |
          case "$SCHEDULE" in
            "7,37 * * * *") JOBS="news moderate" ;;
            "20 */6 * * *") JOBS="polls predictions models" ;;
            "5 12 * * *")   JOBS="discussion" ;;
            *)              JOBS="${REQUESTED:-all}" ;;
          esac
          echo "jobs=$(echo "$JOBS" | tr -cd 'a-z ,')" >> "$GITHUB_OUTPUT"
      - name: Run jobs
        run: node run.mjs $JOBS
        env:
          JOBS: ${{ steps.pick.outputs.jobs }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          AUTO_PUBLISH_POLLS: ${{ vars.AUTO_PUBLISH_POLLS }}
          SITE_URL: ${{ vars.SITE_URL }}
          LOCAL_AI_DIR: /home/runner/localai
      # GitHub pauses scheduled jobs in repositories with no activity for 60 days.
      # Re-enabling the workflow once a day resets that timer, so the site keeps running unattended.
      - name: Keep the schedule alive
        if: github.event.schedule == '5 12 * * *'
        continue-on-error: true
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/jobs.yml/enable"
